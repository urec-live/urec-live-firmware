; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Two firmwares live in this project (see docs/rep-counting-walkthrough.md):
;   beacon  - Feather nRF52840 Express + LIS3DH (+ magnetometer), counts reps, advertises an
;             iBeacon, weighs each set (docs/weight-sensing.md)
;   gateway - ESP32-C3-DevKitM-1, scans the beacons, uploads to Firebase + UREC Live
; Shared, board-independent logic is in lib/gym_core (also used by test/).
;
;   pio run -e beacon -t upload      pio device monitor -e beacon
;   pio run -e gateway -t upload     pio device monitor -e gateway

[platformio]
default_envs = beacon

[env]
framework = arduino
monitor_speed = 115200

[env:beacon]
platform = nordicnrf52@11.0.0
board = adafruit_feather_nrf52840
build_src_filter = +<beacon/>
; Both boards are usually plugged in at once - pin the ports if auto-detect picks the wrong one.
; upload_port = COM5
; monitor_port = COM5
; The beacon has its own register-level sensor drivers (src/beacon/lis3dh_motion.cpp,
; tmag5273_mag.cpp) and needs no extra libraries. The Adafruit sensor libraries are deliberately
; not used: they break `pio test -e beacon`, because the test build does not resolve their
; Wire -> TinyUSB dependency (docs/weight-sensing.md §6).

[env:gateway]
; pioarduino = Arduino-ESP32 core 3.3.12 (IDF 5.5.5). The official alternative with the
; same core is "platform = espressif32 @ 8.0.0".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
board_build.partitions = huge_app.csv
build_src_filter = +<gateway/>
; upload_port = COM6
; monitor_port = COM6
lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
  bblanchon/ArduinoJson@7.4.3
